<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiPlatform Hub</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-container">
            <button id="menu-left" class="menu-btn">☰</button>
            <div class="tabs">
                <button class="tab-btn active" data-tab="shop">SHOP</button>
                <button class="tab-btn" data-tab="blog">BLOG</button>
                <button class="tab-btn" data-tab="apps">APPS</button>
            </div>
            <button id="admin-btn" class="admin-btn">⚙️ Admin</button>
            <button id="menu-right" class="menu-btn">☰</button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Content will be loaded dynamically -->
    </main>

    <!-- Left Sidebar -->
    <aside id="left-sidebar" class="sidebar left">
        <!-- Dynamic content from admin -->
    </aside>

    <!-- Right Sidebar -->
    <aside id="right-sidebar" class="sidebar right">
        <!-- Dynamic content from admin -->
    </aside>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Admin Login</h2>
            <input type="password" id="admin-password" placeholder="Enter Password">
            <button id="login-btn">Login</button>
            <button id="cancel-btn">Cancel</button>
        </div>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
